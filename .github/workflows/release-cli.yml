name: Release CLI

# Push a tag like cli-v0.1.0 to build the binaries web/public/install.sh downloads.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Test
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: cli
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#cli-v}" \
              -o "dist/distro-${target%/*}-${target#*/}" .
          done
          cd dist && sha256sum distro-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cli/dist/* --title "Distro CLI ${GITHUB_REF_NAME#cli-v}" --generate-notes
